project]
name = "fde-assessment"
version = "1.0.0"
description = "FDE/AI Integration assessment: MCP server, MCP gateway, LLM streaming guardrail, model router"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
task1-server     = "task1_mcp_server.server:main"
task2-downstream = "task2_gateway_proxy.downstream_mock:serve"
task2-gateway    = "task2_gateway_proxy.gateway:serve"
task3-gateway    = "task3_stream_guardrail.gateway:serve"
task4-gateway    "task4_model_router.router:serve"   # <- fix: "task4_model_router.router:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["task1_mcp_server*", "task2_gateway_proxy*",
           "task3_stream_guardrail*", "task4_model_router*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["task1_mcp_server", "task2_gateway_proxy",
             "task3_stream_guardrail", "task4_model_router"]