model:
  type: "logistic_regression"  
  random_state: 42

logistic_regression:
  C: 1.0
  max_iter: 1000
  solver: "lbfgs"

random_forest:
  n_estimators: 100
  max_depth: 10
  min_samples_split: 2

gradient_boosting:
  n_estimators: 100
  max_depth: 5
  learning_rate: 0.1

data:
  train_test_split: 0.2
  min_samples: 500

preprocessing:
  max_features: 10000
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.95

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"

mlflow:
  experiment_name: "imdb_sentiment_analysis"
  tracking_uri: "/app/mlruns"